name: Sheepdog

# pull_request_target runs this file from the base branch, so a pull request cannot change it.
# The job never checks out or runs the code of the pull request.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sheepdog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Sheepdog classification
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/sheepdog/ci@d3d7988d3fa8c3dfaf46b953b829ac0e827c699b
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
