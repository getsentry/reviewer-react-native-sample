# Rules for the Sheepdog auto-reviewer. The server reads this file from the base branch of each pull request.
# A pull request goes to the first lane whose conditions all match. Every other pull request needs a manual review.
# max_score is the highest classification score (1 to 10) that the lane accepts. The model can only move a pull request to a stricter lane.
version: 1

# Every classification of this repository uses this model: the Classify button in the app and the CI workflow.
# ci: true lets the server use the score from .github/workflows/sheepdog.yml.
# comment: true lets that workflow post the score as a comment on the pull request.
classification:
  model: anthropic/claude-sonnet-5.5
  ci: true
  comment: true

# Each AI review in the Sheepdog web app uses the default model of the user, because review.model is not set.
# comment: true shows a "Post to GitHub" button on a review, which posts it with a comment on the line of each finding.
review:
  comment: true

lanes:
  safe:
    authors: ["dependabot[bot]"]
    paths: ["package.json", "package-lock.json"]
    max_changed_lines: 50
    max_score: 2
    no_major_bumps: true
    require_checks: true
    action: approve-and-automerge

  docs:
    paths: ["docs/**", "README.md", "CHANGELOG.md"]
    max_changed_lines: 100
    max_score: 2
    require_checks: true
    action: approve-and-automerge

  quick_look:
    max_changed_lines: 300
    max_score: 4
    action: suggest

never_automatic:
  paths: [".github/**", "src/sentry.ts", "app.json", "metro.config.js"]
